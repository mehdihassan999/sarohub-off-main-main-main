    <!-- Immediate Favicon Sync from LocalStorage to prevent reload flash -->
    <script>
      (function() {
        try {
          var serverFav = document.getElementById('sarohub-favicon-svg');
          if (serverFav && serverFav.href.indexOf('?') !== -1) return;

          var fav = localStorage.getItem('sarohub_favicon');
          if (fav && typeof fav === 'string' && fav.trim()) {
            fav = fav.trim();
            var isSvg = fav.indexOf('.svg') !== -1;
            var isIco = fav.indexOf('.ico') !== -1;
            var isPng = fav.indexOf('.png') !== -1;
            var mime = isSvg ? 'image/svg+xml' : (isIco ? 'image/x-icon' : (isPng ? 'image/png' : 'image/webp'));
            
            var fav32 = document.getElementById('sarohub-favicon-32');
            if (fav32) { fav32.href = fav; fav32.type = mime; }
            var fav16 = document.getElementById('sarohub-favicon-16');
            if (fav16) { fav16.href = fav; fav16.type = mime; }
            var favSvg = document.getElementById('sarohub-favicon-svg');
            if (favSvg) { favSvg.href = fav; favSvg.type = mime; }
            var shortcut = document.getElementById('sarohub-favicon-ico');
            if (shortcut) { shortcut.href = fav; }
            var apple = document.getElementById('sarohub-favicon-apple');
            if (apple) { apple.href = fav; }
            var tile = document.getElementById('sarohub-favicon-tile');
            if (tile) { tile.content = fav; }
          }
        } catch (e) {}
      })();
    </script>
